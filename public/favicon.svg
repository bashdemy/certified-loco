<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Circular badge with Kazakhstan turquoise and golden ring -->
  <circle cx="32" cy="32" r="30" fill="#0097b2"/>
  <circle cx="32" cy="32" r="28" fill="#0284c7" stroke="#fbbf24" stroke-width="2.5"/>

  <!-- Sun Rays & Ornament (Golden Top) -->
  <circle cx="32" cy="12" r="2" fill="#fbbf24"/>
  <path d="M26 12 Q32 8 38 12" stroke="#fbbf24" stroke-width="1.5" fill="none"/>

  <!-- Locomotive Cab Body -->
  <rect x="16" y="16" width="32" height="30" rx="6" fill="#0c4a6e" stroke="#fbbf24" stroke-width="1.5"/>

  <!-- Upper Windshield (Twin Glazing) -->
  <rect x="20" y="20" width="10" height="9" rx="2" fill="#e0f2fe"/>
  <rect x="34" y="20" width="10" height="9" rx="2" fill="#e0f2fe"/>

  <!-- Golden Grille / Kazakhstan Rail Brand Plate -->
  <rect x="22" y="32" width="20" height="4" rx="1.5" fill="#fbbf24"/>

  <!-- Twin Lower Headlights (High-beam) -->
  <circle cx="21" cy="40" r="3" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
  <circle cx="43" cy="40" r="3" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
  <!-- Central Top Spotlight -->
  <circle cx="32" cy="17" r="2.2" fill="#fef08a" stroke="#ca8a04" stroke-width="0.8"/>

  <!-- Locomotive Cowcatcher / Pilot -->
  <path d="M18 47 L22 53 L42 53 L46 47 Z" fill="#0369a1" stroke="#fbbf24" stroke-width="1.2"/>

  <!-- Steel Rails -->
  <line x1="8" y1="56" x2="56" y2="56" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="14" y1="59" x2="50" y2="59" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
</svg>
